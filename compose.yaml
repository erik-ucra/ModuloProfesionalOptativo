name: gestor-incidencias

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d incidencias"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - datos

  backend:
    image: ${BACKEND_IMAGE}
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend
      - datos

  frontend:
    image: ${FRONTEND_IMAGE}
    ports:
      - "127.0.0.1:${PUERTO_WEB}:80"
    depends_on:
      - backend
    networks:
      - frontend

volumes:
  postgres_data:

networks:
  frontend:
  datos:
